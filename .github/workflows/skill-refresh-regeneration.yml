name: Skill Refresh Governance Regeneration

on:
  push:
    branches: ["work/skill-authority-refresh"]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Regenerate project truth
        shell: pwsh
        run: python .workflow/tools/sync_project_truth.py
      - name: Seal generated governance
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow/acceptance.json .workflow/generated docs
          if (-not (git diff --cached --quiet)) {
            git commit -m "governance: regenerate docs for Skill authority refresh"
          }
      - name: Validate generated governance
        shell: pwsh
        run: |
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_cross_document_consistency.py --base 08f5a741412a2f5c69478b157529245b9a9a260e --require-base
          python .workflow/tools/validate_project_truth.py
      - name: Push generated governance
        shell: pwsh
        run: git push origin HEAD:work/skill-authority-refresh
