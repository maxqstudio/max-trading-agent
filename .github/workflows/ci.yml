name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-foundation:
    name: Python checks and MT5 KB validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q max_trading_agent tests
      - name: Run unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Validate catalog and index
        run: |
          python -m max_trading_agent validate
          python -m max_trading_agent index --db /tmp/mt5_knowledge.sqlite3
          python -m max_trading_agent search "bid ask" --db /tmp/mt5_knowledge.sqlite3
          python -m max_trading_agent plan prepare_entry

# No account credentials, broker connection, market access, or order sending in CI.
