name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-foundation:
    name: Python checks and MT5 KB validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy for real MT5 dtype compatibility tests
        run: python -m pip install numpy==2.2.6
      - name: Compile Python sources
        run: python -m compileall -q max_trading_agent tests
      - name: Run unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Agent event-journal smoke
        run: python -m max_trading_agent run analyze_symbol --journal /tmp/agent_events.sqlite3 --db /tmp/mt5_knowledge.sqlite3
      - name: Validate catalog and index
        run: |
          python -m max_trading_agent validate
          python -m max_trading_agent index --db /tmp/mt5_knowledge.sqlite3
          python -m max_trading_agent search "bid ask" --db /tmp/mt5_knowledge.sqlite3
          python -m max_trading_agent plan prepare_entry

# No account credentials, broker connection, market access, or order sending in CI.

  browser-assets:
    name: JavaScript syntax and UI assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check ui/app.js
      - name: Static assets
        run: |
          test -s ui/index.html
          test -s ui/style.css
          test -s ui/app.js

  mt5-numpy-windows:
    name: Windows structured-rate compatibility
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy for real MT5 dtype compatibility tests
        run: python -m pip install numpy==2.2.6
      - name: Compile Python sources
        run: python -m compileall -q max_trading_agent tests
      - name: Run full fake-MT5 Python regression
        run: python -m unittest discover -s tests -v
# GitHub-hosted Windows has NO MT5 terminal and runs NO broker/order requests.
