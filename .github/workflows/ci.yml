name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-foundation:
    name: Python checks and MT5 KB validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install NumPy structured-rate test dependency
        run: python -m pip install numpy==2.2.6
      - name: Compile Python sources
        run: python -m compileall -q max_trading_agent tests
      - name: Run unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Agent event-journal smoke
        run: python -m max_trading_agent run analyze_symbol --journal /tmp/agent_events.sqlite3 --db /tmp/mt5_knowledge.sqlite3
      - name: Validate catalog and index
        run: |
          python -m max_trading_agent validate
          python -m max_trading_agent index --db /tmp/mt5_knowledge.sqlite3
          python -m max_trading_agent search "bid ask" --db /tmp/mt5_knowledge.sqlite3
          python -m max_trading_agent plan prepare_entry

# No account credentials, broker connection, market access, or order sending in CI.

  browser-assets:
    name: JavaScript syntax and UI assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check ui/app.js
      - name: Trading Room decision rendering regression
        run: node --test tests/trading_room.test.cjs
      - name: Static assets
        run: |
          test -s ui/index.html
          test -s ui/style.css
          test -s ui/app.js

  windows-readonly-smoke:
    name: Windows hosted fake-MT5 regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install NumPy structured-rate test dependency
        run: python -m pip install numpy==2.2.6
      - name: Windows read-only offline suite
        run: python -m unittest discover -s tests -v

# Windows runner contains no MetaTrader5 installation or broker account.
# This validates mocks and Python cross-platform behavior only.
