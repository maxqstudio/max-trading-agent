name: R02 Integrity Read-Order Targeted

on:
  push:
    branches: ["work/r02-authority-integrity"]

permissions:
  contents: read

concurrency:
  group: r02-integrity-read-order-targeted
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Run R02 integrity targeted tests
        shell: pwsh
        run: |
          python -m pytest backend/tests/test_r02_discovery_contract.py backend/tests/test_r02_preflight.py backend/tests/test_r02_authorization_store.py backend/tests/test_r02_authorization_service.py backend/tests/test_r02_outcome_contract.py -q -o addopts=
