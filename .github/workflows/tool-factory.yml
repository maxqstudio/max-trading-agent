name: Tool Factory isolated Docker oracle

on:
  push:
    branches: ["feat/c06-**", "feat/g20-**", "feat/g21-**", "feat/g22-**", "feat/g23-**", "feat/g24-**", "feat/g25-**", "feat/g26-**", "feat/g27-**", "feat/g28-**", "feat/g30-**", "feat/g31-**", "feat/g32-**"]
  pull_request:
    paths:
      - "max_trading_agent/tool_factory.py"
      - "max_trading_agent/tool_review.py"
      - "max_trading_agent/tool_properties.py"
      - "max_trading_agent/oracle_quarantine.py"
      - "max_trading_agent/review_package.py"
      - "max_trading_agent/signed_evidence.py"
      - "max_trading_agent/signed_review_link.py"
      - "max_trading_agent/review_governance.py"
      - "max_trading_agent/research_registry.py"
      - "max_trading_agent/__main__.py"
      - "tools/factory_sandbox_runner.py"
      - "knowledge/tool_factory_oracles.json"
      - "knowledge/tool_review_contracts.json"
      - "tests/fixtures/tool_factory_rolling_mean.json"
      - "tests/test_tool_review.py"
      - "tests/test_tool_properties.py"
      - "tests/test_oracle_quarantine.py"
      - "tests/test_review_package.py"
      - "tests/test_signed_evidence.py"
      - "tests/test_signed_review_link.py"
      - "tests/test_review_governance.py"
      - "tests/test_research_registry.py"
      - "tools/stack_audit.py"
      - "tests/test_stack_audit.py"
      - "tools/sequential_merge_rehearsal.py"
      - "tests/test_sequential_merge_rehearsal.py"
      - "knowledge/g30_pinned_pr_stack.json"
      - "tools/owner_mt5_preflight.py"
      - "tests/test_owner_mt5_preflight.py"
      - "knowledge/g32_pinned_merge_identities.json"
      - "tools/main_integration_gate.py"
      - "tests/test_main_integration_gate.py"
      - ".github/workflows/g32-main-completeness.yml"
      - ".github/workflows/g31-postmerge-main.yml"
      - ".github/workflows/g30-sequential-main.yml"
      - ".github/workflows/g28-stack-handoff.yml"
      - ".github/workflows/g24-signed-t0.yml"
      - "tests/fixtures/tool_factory_range_span.json"
      - ".github/workflows/tool-factory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Unit security and independent oracle contracts
        run: python -m unittest discover -s tests -p test_tool_factory.py -v
      - name: G20 reviewer negative and write-once unit contracts
        run: python -m unittest discover -s tests -p test_tool_review.py -v
      - name: G21 property-contract unit and adversarial tests
        run: python -m unittest discover -s tests -p test_tool_properties.py -v
      - name: G22 untrusted oracle quarantine negative contracts
        run: python -m unittest discover -s tests -p test_oracle_quarantine.py -v
      - name: G23 evidence package provenance and hostile receipt tests
        run: python -m unittest discover -s tests -p test_review_package.py -v
      - name: G24 signed evidence context and Sigstore verification unit gate
        run: python -m unittest discover -s tests -p test_signed_evidence.py -v
      - name: G25 external signer/receipt and G23 binding adversarial tests
        run: python -m unittest discover -s tests -p test_signed_review_link.py -v
      - name: G26 GitHub independent human review and owner gate adversarial tests
        run: python -m unittest discover -s tests -p test_review_governance.py -v
      - name: G26 authenticated GitHub PR review preview (must remain HOLD)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python -m max_trading_agent.review_governance \
            --candidate tests/fixtures/tool_factory_range_span.json \
            --pr 62 \
            --expected-head 9a7379257f4fddef468fa8f4a023077d2b850c27 \
            --output-dir "$RUNNER_TEMP/g26-preview" \
            > "$RUNNER_TEMP/g26-status.json" || status=$?
          test "$status" -eq 3
          python - <<'PY'
          import json, os, pathlib
          data=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'g26-status.json').read_text())
          assert data['status']=='G26_REVIEW_GATES_RECORDED_NO_ADMISSION'
          assert data['candidate_verified'] is False
          assert data['t1_registry_enabled'] is False
          assert data['tool_admitted'] is False
          assert data['decision']=='NO_TRADE' and data['execution']=='DISABLED'
          assert data['gates']['github_pr_head_match'] is True
          assert data['gates']['merged_and_closed'] is False
          assert data['gates']['not_draft'] is False
          print('G26 PASS: actual GitHub PR #62 remains draft/unmerged; authenticated review gate HOLD, no admission')
          PY
      - name: G27 static trusted references and non-executable candidate inbox unit tests
        run: python -m unittest discover -s tests -p test_research_registry.py -v
      - name: G27 real read-only reference CLI and disabled generated tool staging
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, sys, tempfile
          def invoke(*args):
              return subprocess.run([sys.executable, "-m",
                "max_trading_agent.research_registry", *args],
                text=True, capture_output=True, timeout=20)
          listing=invoke("list")
          assert listing.returncode==0
          names=[x["tool_id"] for x in json.loads(listing.stdout)["entries"]]
          assert names==["range_span_v1","rolling_mean_v1"]
          mean=invoke("evaluate","--tool-id","rolling_mean_v1","--values","[2,4,6]")
          assert mean.returncode==0 and json.loads(mean.stdout)["result"]==4.0
          spread=invoke("evaluate","--tool-id","range_span_v1","--values","[-4,0,7]")
          assert spread.returncode==0
          assert json.loads(spread.stdout)["result"]==11.0
          denied=invoke("evaluate","--tool-id","llm_unknown_signal","--values","[1,2]")
          assert denied.returncode!=0
          with tempfile.TemporaryDirectory() as tmp:
              root=pathlib.Path(tmp)
              staged=invoke("stage","--file","tests/fixtures/tool_factory_range_span.json",
                            "--stage-dir",str(root/"pending"))
              assert staged.returncode==3
              state=json.loads(staged.stdout)
              assert state["status"]=="T1_CANDIDATE_NOT_REGISTERED"
              assert not state["tool_admitted"] and not state["candidate_source_executed"]
              assert state["execution"]=="DISABLED" and state["decision"]=="NO_TRADE"
              assert len(list((root/"pending").glob("*.json")))==1
          print("G27 PASS: two static reference computations, novel tool denied, candidate stage NOT_REGISTERED, NO_TRADE")
          PY
      - name: G28 all stacked PR merge-handoff and mutation-denial tests
        run: python -m unittest discover -s tests -p test_stack_audit.py -v
      - name: G30 pinned sequential merge topology and fail-closed runner tests
        run: python -m unittest discover -s tests -p test_sequential_merge_rehearsal.py -v
      - name: G31 offline owner prerequisites and no-side-effects regression
        run: python -m unittest discover -s tests -p test_owner_mt5_preflight.py -v
      - name: G32 actual-main-only merge completeness negative tests
        run: python -m unittest discover -s tests -p test_main_integration_gate.py -v
      - name: Fetch public sandbox runtime (no secrets mounted)
        run: docker pull python:3.12-alpine
      - name: Known correct candidate must pass isolated oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m max_trading_agent tool-sandbox --file tests/fixtures/tool_factory_rolling_mean.json > "$RUNNER_TEMP/candidate_result.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/candidate_result.json")); assert d["status"] == "SANDBOX_PASSED_REVIEW_REQUIRED" and d["decision"] == "NO_TRADE" and not d["broker_execution"]'
      - name: Incorrect candidate must fail and exit nonzero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, sys, tempfile
          item=json.loads(pathlib.Path('tests/fixtures/tool_factory_rolling_mean.json').read_text())
          item['code']='def analyze(values):\n    return 999\n'
          with tempfile.TemporaryDirectory() as tmp:
              path=pathlib.Path(tmp)/'bad.json'
              path.write_text(json.dumps(item))
              result=subprocess.run([sys.executable,'-m','max_trading_agent','tool-sandbox','--file',str(path)], capture_output=True, text=True)
              assert result.returncode == 3, (result.returncode, result.stderr)
              report=json.loads(result.stdout)
              assert report['status']=='SANDBOX_FAILED'
              assert report['decision']=='NO_TRADE' and not report['broker_execution']
          PY

      - name: G20 real-Docker independent T0 review, oracle gaming veto and unknown pending
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, sys, tempfile
          fixture=pathlib.Path('tests/fixtures/tool_factory_rolling_mean.json')
          with tempfile.TemporaryDirectory(prefix='g20_accept_') as root:
              work=pathlib.Path(root)
              approved=work/'reviewed'
              def invoke(command, candidate):
                  return subprocess.run(
                      [sys.executable, '-m', 'max_trading_agent', command,
                       '--file', str(candidate), '--review-dir', str(approved)],
                      text=True, capture_output=True, timeout=120,
                  )
              good=invoke('tool-review', fixture)
              assert good.returncode == 0, (good.returncode, good.stderr[-500:])
              g=json.loads(good.stdout)
              assert g['status']=='T0_SANDBOX_REVIEWED' and g['decision']=='NO_TRADE'
              assert g['execution']=='DISABLED' and not g['broker_execution']
              assert not g['eligible_for_demo_or_live'] and g['evidence_only']
              assert len(list(approved.glob('*.json'))) == 1
              original=json.loads(fixture.read_text())
              cheat=dict(original)
              cheat['code']=('def analyze(values):\n'
                  '    if values == [1, 2, 3]:\n        return 2\n'
                  '    if values == [2, 4, 6, 8]:\n        return 5\n'
                  '    if values == [-2, 0, 2]:\n        return 0\n'
                  '    if values == [0.5, 1.5, 2.5]:\n        return 1.5\n'
                  '    if values == [12.5]:\n        return 12.5\n'
                  '    return 999\n')
              cheatfile=work/'cheat.json'
              cheatfile.write_text(json.dumps(cheat))
              first=invoke('tool-sandbox', cheatfile)
              assert first.returncode == 0, (first.returncode, first.stderr[-500:])
              assert json.loads(first.stdout)['status']=='SANDBOX_PASSED_REVIEW_REQUIRED'
              reviewed=invoke('tool-review', cheatfile)
              assert reviewed.returncode == 3, (reviewed.returncode, reviewed.stderr[-500:])
              r=json.loads(reviewed.stdout)
              assert r['status']=='T0_REVIEW_REJECTED' and r['failed_stage']=='CHALLENGE'
              unknown=dict(original)
              unknown['tool_id']='new_undocumented_indicator'
              unfile=work/'unknown.json'
              unfile.write_text(json.dumps(unknown))
              pending=invoke('tool-review', unfile)
              assert pending.returncode == 3
              assert json.loads(pending.stdout)['status']=='PENDING_INDEPENDENT_ORACLE'
              assert len(list(approved.glob('*.json'))) == 1
              print('G20: correct known T0 reviewed; oracle lookup cheat rejected; novel tool pending; only one immutable receipt')
          PY

      - name: G21 real Docker new independent range contract and memorized-fixture veto
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, sys, tempfile
          fixture=pathlib.Path('tests/fixtures/tool_factory_range_span.json')
          oracle=json.loads(pathlib.Path('knowledge/tool_factory_oracles.json').read_text())
          with tempfile.TemporaryDirectory(prefix='g21_property_') as root:
              work=pathlib.Path(root)
              receipts=work/'receipts'
              def invoke(command, file):
                  return subprocess.run(
                      [sys.executable, '-m', 'max_trading_agent', command,
                       '--file', str(file), '--review-dir', str(receipts)],
                      capture_output=True, text=True, timeout=120)
              good=invoke('tool-property-review', fixture)
              assert good.returncode == 0, (good.returncode, good.stderr[-500:])
              report=json.loads(good.stdout)
              assert report['status']=='T0_PROPERTY_REVIEWED' and report['reference']=='NUMERIC_RANGE'
              assert report['golden_cases']==5 and report['property_cases']==32
              assert report['decision']=='NO_TRADE' and report['execution']=='DISABLED'
              assert not report['broker_execution'] and not report['eligible_for_demo_or_live']
              assert report['owner_acceptance']=='PENDING' and report['evidence_only']
              assert len(list(receipts.glob('*.json')))==1
              real=json.loads(fixture.read_text())
              bad=dict(real)
              statements=['def analyze(values):']
              for row in oracle['range_span_v1']:
                  statements.append('    if values == '+repr(row['input'])+':')
                  statements.append('        return '+repr(row['expected']))
              statements.append('    return 999')
              bad['code']='\n'.join(statements)+'\n'
              path=work/'oracle_cheat.json'
              path.write_text(json.dumps(bad))
              old=invoke('tool-sandbox', path)
              assert old.returncode==0, (old.returncode, old.stderr[-500:])
              assert json.loads(old.stdout)['status']=='SANDBOX_PASSED_REVIEW_REQUIRED'
              failed=invoke('tool-property-review', path)
              assert failed.returncode==3, (failed.returncode, failed.stderr[-500:])
              f=json.loads(failed.stdout)
              assert f['status']=='T0_PROPERTY_REJECTED' and f['failed_stage']=='PROPERTIES'
              unknown=dict(real)
              unknown['tool_id']='unreviewed_meanlike_candidate'
              unknown_file=work/'unreviewed.json'
              unknown_file.write_text(json.dumps(unknown))
              pending=invoke('tool-property-review', unknown_file)
              assert pending.returncode==3
              assert json.loads(pending.stdout)['status']=='PENDING_INDEPENDENT_ORACLE'
              assert len(list(receipts.glob('*.json')))==1
              print('G21: new reviewed contract passed; fixed-oracle lookup cheat failed property challenge; unknown remains PENDING; no trading authority')
          PY

      - name: G22 offline oracle audit CLI remains quarantined even when reference consistent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, sys, tempfile
          from max_trading_agent.tool_factory import validate_candidate
          trusted=[
              pathlib.Path("knowledge/tool_factory_oracles.json"),
              pathlib.Path("knowledge/tool_review_contracts.json"),
          ]
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in trusted}
          fixture=json.loads(pathlib.Path(
              "tests/fixtures/tool_factory_range_span.json").read_text())
          with tempfile.TemporaryDirectory(prefix="g22_oracles_") as directory:
              root=pathlib.Path(directory)
              candidate_file=root/"candidate.json"
              hypothesis_file=root/"hypothesis.json"
              receipts=root/"quarantine"
              def run(candidate,pack):
                  candidate_file.write_text(json.dumps(candidate))
                  hypothesis_file.write_text(json.dumps(pack))
                  return subprocess.run([
                      sys.executable, "-m", "max_trading_agent",
                      "tool-oracle-audit", "--file", str(candidate_file),
                      "--oracle-file", str(hypothesis_file),
                      "--audit-dir", str(receipts)
                  ],text=True,capture_output=True,timeout=20)
              hypothesis={
                  "tool_id":fixture["tool_id"],
                  "candidate_sha256":validate_candidate(fixture)["sha256"],
                  "hypothesis":"Calculate the largest input value minus the smallest.",
                  "cases":[{"input":[5,3,7],"expected":4},
                           {"input":[-4,9],"expected":13},
                           {"input":[11],"expected":0}],
                  "properties":["PERMUTATION_INVARIANT","TRANSLATION_INVARIANT"],
              }
              known=run(fixture,hypothesis)
              assert known.returncode==3,(known.returncode,known.stderr[-300:])
              result=json.loads(known.stdout)
              assert result["status"]=="QUARANTINED_REFERENCE_CONSISTENT"
              assert not result["trusted_oracle_adopted"]
              assert not result["candidate_verified"]
              assert result["decision"]=="NO_TRADE"
              assert result["execution"]=="DISABLED"
              assert len(list(receipts.glob("*.json")))==1
              mismatch=json.loads(json.dumps(hypothesis))
              mismatch["cases"][0]["expected"]=999
              wrong=run(fixture,mismatch)
              assert wrong.returncode==3, (wrong.returncode,wrong.stderr[-300:])
              assert json.loads(wrong.stdout)["status"]=="QUARANTINED_REFERENCE_MISMATCH"
              novel=dict(fixture)
              novel["tool_id"]="brand_new_unreviewed_feature"
              novel_hypothesis=json.loads(json.dumps(hypothesis))
              novel_hypothesis["tool_id"]=novel["tool_id"]
              novel_hypothesis["candidate_sha256"]=validate_candidate(novel)["sha256"]
              unknown=run(novel,novel_hypothesis)
              assert unknown.returncode==3, (unknown.returncode,unknown.stderr[-300:])
              out=json.loads(unknown.stdout)
              assert out["status"]=="QUARANTINED_UNVERIFIED"
              assert not out["trusted_reference_checked"]
              assert not out["eligible_for_demo_or_live"]
              assert len(list(receipts.glob("*.json")))==3
          after={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in trusted}
          assert after==before, "trusted oracle/contract mutated by untrusted audit"
          print("G22 PASS: reference-consistent still quarantined; mismatch caught; novel quarantined; trusted fixtures untouched; NO_TRADE")
          PY

      - name: G23 offline review-package CLI cannot authorize or mutate trusted references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, sys, tempfile
          from max_trading_agent.oracle_quarantine import audit_hypothesis
          from max_trading_agent.tool_properties import review_t0_properties
          from max_trading_agent.tool_factory import validate_candidate
          from unittest.mock import patch
          fixture=pathlib.Path("tests/fixtures/tool_factory_range_span.json")
          original=json.loads(fixture.read_text())
          watched=[
              pathlib.Path("knowledge/tool_factory_oracles.json"),
              pathlib.Path("knowledge/tool_review_contracts.json"),
          ]
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in watched}
          hypothesis={
              "tool_id":original["tool_id"],
              "candidate_sha256":validate_candidate(original)["sha256"],
              "hypothesis":"Numeric distance between largest and smallest input.",
              "cases":[{"input":[4,5],"expected":1},
                       {"input":[-3,2],"expected":5},
                       {"input":[1,9,4],"expected":8}],
              "properties":["PERMUTATION_INVARIANT"],
          }
          audit=audit_hypothesis(original,hypothesis)
          with tempfile.TemporaryDirectory(prefix="g23_packet_") as tmp:
              root=pathlib.Path(tmp)
              artifacts=[
                  ("candidate.json",original),
                  ("oracle.json",hypothesis),
                  ("audit.json",audit),
              ]
              for name,payload in artifacts:
                  (root/name).write_text(json.dumps(payload))
              dest=root/"packets"
              args=[
                  sys.executable, "-m", "max_trading_agent",
                  "tool-review-package", "--file", str(root/"candidate.json"),
                  "--oracle-file", str(root/"oracle.json"),
                  "--audit-file", str(root/"audit.json"),
                  "--package-dir", str(dest),
              ]
              run=subprocess.run(args,text=True,capture_output=True,timeout=20)
              assert run.returncode==3, (run.returncode,run.stderr[-300:])
              out=json.loads(run.stdout)
              assert out["status"]=="REVIEW_PACKAGE_INCOMPLETE"
              assert out["decision"]=="NO_TRADE" and out["execution"]=="DISABLED"
              assert not out["package_is_execution_attestation"]
              assert "SIGNED_SANDBOX_EXECUTION_ATTESTATION" in out["missing_evidence"]
              assert len(list(dest.glob("*.json")))==1
              assert original["code"] not in run.stdout
              bad=dict(audit)
              bad["trusted_oracle_adopted"]=True
              (root/"audit.json").write_text(json.dumps(bad))
              fail=subprocess.run(args,text=True,capture_output=True,timeout=20)
              assert fail.returncode==2 and "TOOL_FACTORY_BLOCKED" in fail.stderr
              assert len(list(dest.glob("*.json")))==1
          after={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in watched}
          assert before==after, "G23 review mutated trusted reference files"
          print("G23 PASS: immutable incomplete review packet; forged audit denied; no source exposure or trusted mutation; NO_TRADE")
          PY
