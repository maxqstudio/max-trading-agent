name: R02 Outcome Closeout One Shot

on:
  push:
    branches: ["work/r02-outcome-ledger"]

permissions:
  contents: write

concurrency:
  group: r02-outcome-closeout-one-shot
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Regenerate Project Truth Compiler outputs
        shell: pwsh
        run: python .workflow/tools/sync_project_truth.py
      - name: Rebuild Scientist knowledge
        shell: pwsh
        run: python scripts/build_scientist_knowledge.py
      - name: Validate regenerated governance
        shell: pwsh
        run: |
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_cross_document_consistency.py --allow-dirty
          python .workflow/tools/validate_project_truth.py --allow-dirty
      - name: Commit projections and remove one-shot
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r02-outcome-closeout-one-shot.yml
          git add .workflow/acceptance.json .workflow/generated docs scientist/knowledge
          git commit -m "docs: close R02 outcome-ledger hosted evidence"
          git push origin HEAD:work/r02-outcome-ledger
