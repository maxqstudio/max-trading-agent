name: R02 Overflow Governance One Shot

on:
  push:
    branches: ["work/r02-outcome-ledger"]

permissions:
  contents: write

concurrency:
  group: r02-overflow-governance-one-shot
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Regenerate Project Truth Compiler outputs
        shell: pwsh
        run: python .workflow/tools/sync_project_truth.py
      - name: Regenerate current DURING sequence actuals
        shell: pwsh
        run: |
          $sessions = Get-ChildItem "docs/sequence/sessions/*.json" | Sort-Object Name
          $sourceDigest = $null
          foreach ($file in $sessions) {
            $session = Get-Content $file.FullName -Raw | ConvertFrom-Json
            $session.phase = "R02_CHEAP_SCREEN_OUTCOME_LEDGER"
            $session.implementation_base_sha = "eb6192873eb518b9fe4c7f15d03600ca4ac1e73d"
            $args = @(".workflow/tools/generate_sequence_actual.py","--root",".","--output-json",[string]$session.actual.graph,"--output-mermaid",[string]$session.actual.diagram)
            foreach ($entry in $session.actual.entries) { $args += @("--entry",[string]$entry) }
            python @args
            if ($LASTEXITCODE -ne 0) { throw "Sequence generation failed: $($session.session_id)" }
            $actual = Get-Content $session.actual.graph -Raw | ConvertFrom-Json
            $session.actual.source_digest = [string]$actual.source_digest
            $sourceDigest = [string]$actual.source_digest
            $session | ConvertTo-Json -Depth 100 | Set-Content $file.FullName -Encoding utf8
          }
          if (-not $sourceDigest) { throw "No sequence sessions found" }
          $reviewPath = ".workflow/sequence_semantic_review.json"
          $review = Get-Content $reviewPath -Raw | ConvertFrom-Json
          foreach ($flow in $review.flows) {
            $flow.source_digest = $sourceDigest
            if ($flow.flow_id -eq "FLOW-R02-CHEAP-SCREEN-OUTCOME-LEDGER") {
              $actualPath = "docs/sequence/generated/FLOW-R02-CHEAP-SCREEN-OUTCOME-LEDGER.actual.json"
              $actual = Get-Content $actualPath -Raw | ConvertFrom-Json
              $flow.generated_nodes = @($actual.nodes).Count
              $flow.generated_edges = @($actual.edges).Count
            }
          }
          $review.generation_anchor_policy.source_digest = $sourceDigest
          $review.generation_anchor_policy.observed_head = $env:GITHUB_SHA
          $review | ConvertTo-Json -Depth 100 | Set-Content $reviewPath -Encoding utf8
      - name: Rebuild Scientist knowledge
        shell: pwsh
        run: python scripts/build_scientist_knowledge.py
      - name: Validate regenerated governance
        shell: pwsh
        run: |
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_cross_document_consistency.py --allow-dirty
          python .workflow/tools/validate_project_truth.py --allow-dirty
      - name: Commit projections and remove temporary workflows
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (Test-Path ".github/workflows/r02-overflow-targeted.yml") { git rm .github/workflows/r02-overflow-targeted.yml }
          git rm .github/workflows/r02-overflow-governance-one-shot.yml
          git add .workflow/acceptance.json .workflow/generated .workflow/sequence_semantic_review.json docs scientist/knowledge
          git commit -m "docs: regenerate overflow-hardened R02 outcome governance"
          git push origin HEAD:work/r02-outcome-ledger
