name: G30 Sequential main merge rehearsal

on:
  push:
    branches: ["feat/g30-sequential-main-rehearsal"]

# ONLY read GitHub. Temporary merge commits are never pushed or uploaded as code.
permissions:
  contents: read

jobs:
  merge-30-heads:
    name: Sequential 30-step integration rehearsal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout G30 controller and pinned manifest (no credentials stored)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout current main for disposable local merge commits
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          ref: main
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: "3.12"
      - name: Unit security tests for pinned 29-PR manifest and merge rules
        env:
          PYTHONPATH: ${{ github.workspace }}/controller
        run: python -m unittest discover -s controller/tests -p test_sequential_merge_rehearsal.py -v
      - name: Rehearse 29 pinned PRs then G30 HEAD as 30 temporary local merges
        shell: bash
        env:
          G30_EXPECTED_MAIN_SHA: 5f27d132bc627fa73fde2e1b56b625cbdb09a465
        run: |
          set -euo pipefail
          python controller/tools/sequential_merge_rehearsal.py \
            --repo work \
            --manifest controller/knowledge/g30_pinned_pr_stack.json \
            --output "$RUNNER_TEMP/g30-sequential-merge.json" \
            --aggregate-dir "$RUNNER_TEMP/g30-aggregate"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"g30-sequential-merge.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["status"]=="G30_SEQUENTIAL_AND_AGGREGATE_TREES_MATCH_TESTS_PENDING"
          assert len(r["completed_steps"])==30
          assert r["trees_identical"] is True
          assert r["sequential_tree_sha"]==r["aggregate_tree_sha"]
          assert r["completed_steps"][0]["pr"]==14
          assert r["completed_steps"][-1]["pr"]==72
          assert r["feature_sha"]==os.environ["GITHUB_SHA"]
          assert r["decision"]=="NO_TRADE" and r["execution"]=="DISABLED"
          assert r["remote_repository_modified"] is False
          print("G30 merge PASS",r["runner_os"],"all 30 PR heads, identical trees",
                r["sequential_tree_sha"])
          PY
      - name: Install offline NumPy structured MT5-rate dependency
        run: python -m pip install numpy==2.2.6
      - name: Full Python regression on exact 30-step final merged tree
        working-directory: work
        run: |
          python -m compileall -q max_trading_agent tests
          python -m unittest discover -s tests -v
      - name: Read-only tool catalog and NO_TRADE smoke on final tree
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          python -m max_trading_agent validate
          python -m max_trading_agent index --db "$RUNNER_TEMP/g30-knowledge.sqlite3"
          python -m max_trading_agent search "bid ask" --db "$RUNNER_TEMP/g30-knowledge.sqlite3"
          python -m max_trading_agent plan prepare_entry
          python -m max_trading_agent run analyze_symbol \
            --journal "$RUNNER_TEMP/g30-agent-events.sqlite3" \
            --db "$RUNNER_TEMP/g30-knowledge.sqlite3"
          python - <<'PY'
          import json, pathlib
          from max_trading_agent.research_registry import (
              evaluate_reference, stage_untrusted_candidate,
          )
          assert evaluate_reference("range_span_v1",[-4,0,7])["result"]==11.0
          assert evaluate_reference("rolling_mean_v1",[2,4,6])["result"]==4.0
          candidate=json.loads(pathlib.Path("tests/fixtures/tool_factory_range_span.json").read_text())
          result=stage_untrusted_candidate(candidate)
          assert result["status"]=="T1_CANDIDATE_NOT_REGISTERED"
          assert result["decision"]=="NO_TRADE" and result["execution"]=="DISABLED"
          assert not result["tool_admitted"]
          PY
      - name: Setup Node for Linux UI regression
        if: runner.os == 'Linux'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Final sequential-merge UI/Trading Room tests
        if: runner.os == 'Linux'
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node --check ui/app.js
          node --test tests/trading_room.test.cjs
          test -s ui/index.html
          test -s ui/style.css
          test -s ui/app.js
      - name: Fetch public isolated runtime for independent Docker checks
        if: runner.os == 'Linux'
        run: docker pull python:3.12-alpine
      - name: Final sequential-merge isolated T0 reviewer rejects wrong code
        if: runner.os == 'Linux'
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          from max_trading_agent.tool_properties import review_t0_properties
          from max_trading_agent.tool_factory import validate_candidate
          path=pathlib.Path("tests/fixtures/tool_factory_range_span.json")
          candidate=json.loads(path.read_text())
          proof=review_t0_properties(candidate)
          assert proof["candidate_sha256"]==validate_candidate(candidate)["sha256"]
          assert proof["status"]=="T0_PROPERTY_REVIEWED"
          assert proof["golden_cases"]==5 and proof["property_cases"]==32
          assert proof["decision"]=="NO_TRADE" and proof["execution"]=="DISABLED"
          bad=dict(candidate)
          bad["code"]="def analyze(values):\n    return 999\n"
          rejected=review_t0_properties(bad)
          assert rejected["status"]=="T0_PROPERTY_REJECTED"
          assert rejected["decision"]=="NO_TRADE"
          print("G30 PASS: actual Docker positive and adversarial math review, NO_TRADE")
          PY
      - name: Finalize passing OS rehearsal record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"g30-sequential-merge.json"
          report=json.loads(p.read_text(encoding="utf-8"))
          assert report["status"]=="G30_SEQUENTIAL_AND_AGGREGATE_TREES_MATCH_TESTS_PENDING"
          assert len(report["completed_steps"])==30
          assert report["sequential_tree_sha"]==report["aggregate_tree_sha"]
          report["status"]="G30_SEQUENTIAL_MERGE_AND_REGRESSION_PASS"
          report["test_suite_passed"]=True
          report["docker_review_passed"]=os.environ["RUNNER_OS"]=="Linux"
          assert report["owner_acceptance"]=="PENDING"
          assert not report["remote_repository_modified"] and not report["generated_tool_admitted"]
          p.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("G30 FINAL PASS:",report["runner_os"],"steps",len(report["completed_steps"]),
                "same final git tree",report["sequential_tree_sha"],"NO_TRADE")
          PY
      - name: Upload per-step SHA and any conflict report, even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: g30-sequential-rehearsal-${{ matrix.os }}
          path: ${{ runner.temp }}/g30-sequential-merge.json
          retention-days: 30
          if-no-files-found: warn
